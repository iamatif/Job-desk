<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#1749c6"><title>Jobdesk · Your next chapter</title><meta name="description" content="Your personal job search workspace. Discover opportunities, save relevant jobs, and take your next career step."><link rel="icon" href="/favicon.svg" type="image/svg+xml"><script src="/theme-init.js"></script><link rel="preload" href="/fonts/manrope.ttf" as="font" type="font/ttf" crossorigin><link rel="preload" href="/fonts/sora.ttf" as="font" type="font/ttf" crossorigin><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/professional.css"><link rel="stylesheet" href="/studio.css"><link rel="stylesheet" href="/profile-editor.css"><link rel="stylesheet" href="/keyword-search.css"><link rel="stylesheet" href="/workspace-history.css"><link rel="stylesheet" href="/settings-tabs.css"><link rel="stylesheet" href="/browser-worker.css"><script type="module" src="/auth.js"></script></head>
<body><div id="app"></div><dialog id="job-dialog"><form id="job-form"><div class="section-heading"><h2>Add a job</h2><button type="button" class="icon-button" data-close aria-label="Close dialog">×</button></div><p class="muted">Keep a promising opportunity in your shortlist. Add its details and the original application link.</p><label>Job title<input name="title" required maxlength="160" placeholder="e.g. Shopify theme developer"></label><label>Company<input name="company" required maxlength="120"></label><div class="form-grid"><label>Work arrangement<select name="location"><option>Remote</option><option>Hybrid</option><option>Onsite</option></select></label><label>Minimum experience (years)<input name="years" type="number" min="0" max="30" step="0.5" value="2" required></label></div><label>Required skills, separated by commas<input name="skills" required maxlength="500" placeholder="Shopify, Liquid, JavaScript"></label><label>Job description<textarea name="description" rows="4" required maxlength="12000"></textarea></label><label>Application URL (optional)<input name="url" type="url" placeholder="https://company.com/careers/role"></label><p class="muted small">Matching uses the required skills you enter. Location eligibility and other requirements need your review.</p><p id="job-feedback" class="form-error" role="alert" hidden></p><button class="button primary" type="submit">Add to my jobs ↗</button></form></dialog><dialog id="confirm-dialog" aria-labelledby="confirm-title"><form method="dialog"><h2 id="confirm-title"></h2><p class="muted mt"></p><div class="actions"><button class="button" value="cancel">Cancel</button><button class="button primary" value="confirm">Continue</button></div></form></dialog><div id="toast" role="status" aria-live="polite"></div></body>
</html>
